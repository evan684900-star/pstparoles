<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Recherche les paroles de tes chansons préférées." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>pstparoles — Recherche de paroles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-bar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 220 230" aria-hidden="true">
        <path d="M150,175 A55,55 0 1 1 95,120" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" />
        <path d="M173,175 A78,78 0 1 1 95,97" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
        <path d="M196,175 A101,101 0 1 1 95,74" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" />
        <circle cx="95" cy="175" r="30" fill="currentColor" />
        <line x1="122" y1="172" x2="122" y2="35" stroke="currentColor" stroke-width="16" stroke-linecap="round" />
        <path d="M122,35 C160,50 178,80 168,108 C163,88 148,72 122,63 Z" fill="currentColor" />
      </svg>
      <span class="brand-name">pstparoles</span>
    </div>

    <form id="search-form">
      <input
        type="search"
        id="search-input"
        placeholder="Artiste - Titre (ex: Stromae Papaoutai)"
        autocomplete="off"
        inputmode="search"
        required
      />
      <button type="submit" aria-label="Rechercher">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span class="btn-label">Rechercher</span>
      </button>
    </form>
  </header>

  <main>
    <p class="subtitle">Trouve les paroles de ta chanson préférée en un instant.</p>

    <div id="status"></div>
    <ul id="results"></ul>

    <div id="lyrics-view" class="hidden">
      <button id="back-button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Retour aux résultats
      </button>
      <h2 id="lyrics-title"></h2>
      <pre id="lyrics-content"></pre>
      <p id="lyrics-link" class="hidden">
        <a href="#" target="_blank" rel="noopener noreferrer">Lire les paroles sur Genius &rarr;</a>
      </p>
    </div>

    <footer>
      <p>Recherche via l'API Genius · Paroles via LRCLIB &amp; lyrics.ovh</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
